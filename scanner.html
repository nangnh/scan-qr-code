<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quét mã vạch — Quản lý Vật tư</title>
  <!--
  docs/external-qr-scanner/scanner.html — TRANG QUÉT CAMERA HOST NGOÀI APPS SCRIPT.

  VÌ SAO CẦN FILE NÀY (đọc trước khi deploy):
  Google Apps Script (HtmlService) luôn phục vụ Web App trong 1 <iframe> sandbox có origin ẩn danh
  (*.googleusercontent.com) — kể cả khi mở đúng URL .../exec đã deploy trực tiếp trên trình duyệt, không
  riêng gì link preview trong editor. Trình duyệt CHẶN getUserMedia() (camera/mic) từ origin sandbox đó vì
  lý do bảo mật — đây là giới hạn nền tảng của Apps Script, không sửa được bằng code/permission trong Apps
  Script (đã kiểm chứng qua tài liệu cộng đồng, không phải giả định — xem
  tasks/backlog-20260822/DEV-19-fix-qr-camera-iframe-sandbox.md).

  File này là 1 trang HTML ĐỘC LẬP, tự chứa (inline mọi CSS/JS, chỉ tải QuaggaJS qua CDN),
  KHÔNG chứa business logic, KHÔNG gọi Apps Script API, KHÔNG đụng Google Sheets — chỉ làm đúng 1 việc:
  mở camera, quét barcode 1D, gửi kết quả về app chính qua `window.opener.postMessage(...)` rồi tự đóng.
  App chính mở file này bằng `window.open(...)` (tab thật, KHÔNG phải iframe) từ views/qr-modals.html.

  CÁCH DEPLOY (chọn 1, đều miễn phí, không cần server riêng — chỉ cần HTTPS + origin thật):
  1. GitHub Pages: đẩy đúng file này lên 1 repo (nhánh nào cũng được) → Settings → Pages → bật cho nhánh đó
     → URL dạng https://<tai-khoan>.github.io/<repo>/scanner.html (hoặc đường dẫn tương ứng nơi đặt file).
  2. Netlify: netlify.com → Sites → "Deploy manually" → kéo-thả 1 thư mục chỉ chứa file này (đổi tên thành
     index.html nếu muốn URL gọn) → nhận URL dạng https://<ten-site>.netlify.app/.
  3. Vercel: tương tự Netlify, kéo-thả deploy 1 thư mục tĩnh.
  Bước tạo tài khoản trên các dịch vụ này KHÔNG được agent tự làm thay (theo policy "không tự tạo tài khoản
  thay người dùng") — người phụ trách deploy (Dev/PM) tự thực hiện, ngoài phạm vi agent này.

  SAU KHI DEPLOY — bắt buộc phải làm:
  Điền URL vừa deploy vào biến `QR_EXTERNAL_SCANNER_URL` ở đầu <script> trong
  src/backend/views/qr-modals.html (đang để rỗng '', nút "Mở trang quét camera" báo lỗi rõ ràng nếu chưa
  điền, không mở URL rỗng).

  BẢO MẬT — vì sao KHÔNG cần xác thực/token ở đây:
  Nội dung barcode chỉ là `ma_vt` thô (mã đầu mục vật tư, không phải dữ liệu nhạy cảm — xem index.html app
  chính, biến đã gửi qua postMessage vẫn được app chính tra cứu lại qua server `traCuuVatTuTheoMa` trước
  khi tin, không tin trực tiếp). Trang này không lưu trữ gì, không có cookie/localStorage, không gọi
  network ngoài việc tải 2 thư viện CDN tĩnh — bề mặt tấn công tối thiểu. postMessage() dùng targetOrigin
  cụ thể (không phải '*') lấy từ query param ?origin=... do app chính truyền vào khi mở tab, để tránh gửi
  nhầm dữ liệu cho 1 trang lạ nếu tab bị điều hướng.
-->
  <!-- Chỉ quét barcode 1D ngay trên trình duyệt, không gửi ảnh ra ngoài -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 8px 0 12px;
      text-align: center;
    }

    .frame {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Quagga tự chèn video vào trong khung này */
    .frame video,
    .frame canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .box {
      position: absolute;
      inset: 20% 10%;
      border: 3px solid #4ade80;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .35);
      z-index: 1;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 1;
      font-size: 13px;
      color: #ddd;
    }

    .msg {
      max-width: 480px;
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.err {
      background: #3a1414;
      color: #ffb4b4;
      border: 1px solid #7a2c2c;
    }

    .msg.ok {
      background: #123a1c;
      color: #b7f0c4;
      border: 1px solid #2c7a44;
    }

    .manual {
      max-width: 480px;
      width: 100%;
      margin-top: 16px;
    }

    .manual input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #171a21;
      color: #fff;
      font-size: 14px;
    }

    .manual button,
    .close-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .close-btn {
      background: #333;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <h1>📷 Quét mã vạch vật tư</h1>
  <div class="frame" id="interactive">
    <div class="box"></div>
    <div class="hint">Đưa mã vạch ngang vào khung</div>
  </div>
  <div id="msg" class="msg"></div>
  <div class="manual">
    <input type="text" id="manualInput" placeholder="Hoặc nhập mã vật tư tay (vd. VT01)">
    <button type="button" onclick="submitManual()">Gửi mã đã nhập</button>
  </div>
  <button type="button" class="close-btn" onclick="window.close()">Đóng tab này</button>

  <script>
    var params = new URLSearchParams(window.location.search);
    var targetOrigin = params.get('origin');
    var sent = false;

    function debugScanResult(code, decoder) {
      alert('Đã quét được mã vạch\n\nDecoder: ' + decoder + '\nMã: ' + code);
    }

    function showMsg(text, type) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg show ' + type;
    }

    function sendResult(code) {
      if (sent) return;
      sent = true;
      if (!targetOrigin) {
        showMsg('Thiếu tham số origin — trang này phải được mở từ nút trong app.', 'err');
        sent = false;
        return;
      }
      if (window.opener) {
        debugScanResult(code, window._lastBarcodeDecoder || 'manual');
        window.opener.postMessage({ type: 'qr-scanned', code: code }, targetOrigin);
        showMsg('Đã gửi mã "' + code + '" về ứng dụng. Có thể đóng tab này.', 'ok');
        Quagga.stop();
        setTimeout(function () { window.close(); }, 900);
      } else {
        showMsg('Không tìm thấy tab đã mở trang này (window.opener trống).', 'err');
        sent = false;
      }
    }

    function submitManual() {
      var v = document.getElementById('manualInput').value.trim();
      if (!v) return;
      sendResult(v);
    }

    function startScanner() {
      if (!targetOrigin) {
        showMsg('Thiếu tham số origin trên URL.', 'err');
      }

      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#interactive'),
          constraints: {
            facingMode: "environment" // Ưu tiên camera sau
          },
        },
        decoder: {
          readers: [
            "ean_reader",     // Hỗ trợ mã vạch EAN-13 như ảnh của bạn
            "ean_8_reader",
            "code_128_reader",
            "code_39_reader",
            "upc_reader",
            "upc_e_reader"
          ]
        },
      }, function (err) {
        if (err) {
          showMsg('Không mở được camera: ' + err, 'err');
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(function (result) {
        var code = result.codeResult.code;
        if (code && !sent) {
          window._lastBarcodeDecoder = 'Quagga';
          sendResult(code);
        }
      });
    }

    window.addEventListener('beforeunload', function () {
      try { Quagga.stop(); } catch (e) { }
    });

    startScanner();
  </script>
</body>

</html>
